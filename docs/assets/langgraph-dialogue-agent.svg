<text x="505" y="586" font-size="11" fill="#475569" text-anchor="middle" dominant-baseline="central">错误码 + 中文提示</text>

<rect x="240" y="648" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="666" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">后处理</text>
<text x="340" y="686" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">候选 · 来源 · 动作 · 历史</text>

<rect x="300" y="738" width="80" height="36" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
<text x="340" y="756" font-size="11" fill="#334155" text-anchor="middle" dominant-baseline="central">END</text>

