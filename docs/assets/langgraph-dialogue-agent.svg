<text x="305" y="586" font-size="11" fill="#475569" text-anchor="middle" dominant-baseline="central">fallback_to_mock</text>

<rect x="430" y="548" width="150" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
