<svg width="100%" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
<title>对话智能体 LangGraph 主图</title>
<desc>AGENT_WORKFLOW_ENGINE=langgraph 时启用：上下文组装、本地规划后按条件边分为执行受控工具、本地模拟应答、调用远程模型和提供方不可用四条路径，最终汇合到后处理或显式报错。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="800" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="40" y="28" font-size="13" font-weight="500" fill="#1F2937">对话智能体 · LangGraph 主图</text>
<text x="40" y="46" font-size="11" fill="#64748B">10 个节点 / 3 条条件边；AGENT_WORKFLOW_ENGINE=langgraph 时启用，节点复用现有服务</text>
<rect x="520" y="58" width="120" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
