<text x="575" y="484" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">降级 / 报错</text>

<rect x="230" y="548" width="150" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
