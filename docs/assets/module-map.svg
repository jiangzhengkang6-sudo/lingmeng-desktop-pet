<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
<title>灵梦桌宠四层架构与十二个核心模块</title>
<desc>自上而下分为交互层、桌面前端层、本地网关层、能力与数据层，每层列出三个模块组及其关键能力。</desc>
<rect x="0" y="0" width="680" height="520" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="40" y="28" font-size="13" font-weight="500" fill="#1F2937">四层架构 · 12 个核心模块</text>
<text x="40" y="46" font-size="11" fill="#64748B">依据 backend/ 与 src/ 源码核对，不采用文档转述</text>

<rect x="40" y="64" width="600" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="52" y="110" font-size="12" font-weight="500" fill="#1F2937">① 交互层</text>
<text x="52" y="128" font-size="11" fill="#64748B">用户可见</text>
<rect x="118" y="74" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="132" y="94" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">语音输入</text>
<text x="132" y="114" font-size="11" fill="#185FA5" dominant-baseline="central">唤醒词 · VAD</text>
<text x="132" y="130" font-size="11" fill="#185FA5" dominant-baseline="central">连续对话循环</text>
<rect x="296" y="74" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="310" y="94" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">文本对话</text>
<text x="310" y="114" font-size="11" fill="#185FA5" dominant-baseline="central">会话 · 记忆候选</text>
<text x="310" y="130" font-size="11" fill="#185FA5" dominant-baseline="central">RAG 来源</text>
<rect x="474" y="74" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="488" y="94" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">桌宠表演</text>
<text x="488" y="114" font-size="11" fill="#185FA5" dominant-baseline="central">动作 · 口型</text>
<text x="488" y="130" font-size="11" fill="#185FA5" dominant-baseline="central">透明置顶窗口</text>

<rect x="40" y="176" width="600" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="52" y="222" font-size="12" font-weight="500" fill="#1F2937">② 桌面前端</text>
<text x="52" y="240" font-size="11" fill="#64748B">Tauri + Vue3</text>
<rect x="118" y="186" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="132" y="206" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">控制台 UI</text>
<text x="132" y="226" font-size="11" fill="#185FA5" dominant-baseline="central">6 页签控制台</text>
<text x="132" y="242" font-size="11" fill="#185FA5" dominant-baseline="central">主控 · 对话 · 语音</text>
<text x="132" y="258" font-size="11" fill="#185FA5" dominant-baseline="central">资源 · 知识 · 系统</text>
<rect x="296" y="186" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="310" y="206" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">语音与渲染</text>
<text x="310" y="226" font-size="11" fill="#185FA5" dominant-baseline="central">ASR 流 · TTS 口型</text>
<text x="310" y="242" font-size="11" fill="#185FA5" dominant-baseline="central">Sprite 帧动画</text>
<rect x="474" y="186" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="488" y="206" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">资源与桌面</text>
<text x="488" y="226" font-size="11" fill="#185FA5" dominant-baseline="central">资源包 · 帧校准</text>
<text x="488" y="242" font-size="11" fill="#185FA5" dominant-baseline="central">Tauri 进程 / 窗口</text>

<rect x="40" y="288" width="600" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="52" y="334" font-size="12" font-weight="500" fill="#1F2937">③ 本地网关</text>
<text x="52" y="352" font-size="11" fill="#64748B">FastAPI</text>
<rect x="118" y="298" width="166" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="132" y="318" font-size="12" font-weight="500" fill="#085041" dominant-baseline="central">对话大脑</text>
<text x="132" y="338" font-size="11" fill="#0F6E56" dominant-baseline="central">Agent 编排 · Persona</text>
<text x="132" y="354" font-size="11" fill="#0F6E56" dominant-baseline="central">记忆治理 · RAG 检索</text>
<rect x="296" y="298" width="166" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="310" y="318" font-size="12" font-weight="500" fill="#085041" dominant-baseline="central">安全边界</text>
<text x="310" y="338" font-size="11" fill="#0F6E56" dominant-baseline="central">身份认证 · 受控工具</text>
<text x="310" y="354" font-size="11" fill="#0F6E56" dominant-baseline="central">白名单 · 审批 · 审计</text>
<rect x="474" y="298" width="166" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="488" y="318" font-size="12" font-weight="500" fill="#085041" dominant-baseline="central">通道与状态</text>
<text x="488" y="338" font-size="11" fill="#0F6E56" dominant-baseline="central">语音代理 · 事件总线</text>
<text x="488" y="354" font-size="11" fill="#0F6E56" dominant-baseline="central">提醒 · 设置 · 日志</text>

<rect x="40" y="400" width="600" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="52" y="446" font-size="12" font-weight="500" fill="#1F2937">④ 能力数据</text>
<text x="52" y="464" font-size="11" fill="#64748B">外部与本地</text>
<rect x="118" y="410" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="132" y="430" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">云端能力</text>
<text x="132" y="450" font-size="11" fill="#185FA5" dominant-baseline="central">MiniMax · 豆包</text>
<text x="132" y="466" font-size="11" fill="#185FA5" dominant-baseline="central">Qwen · 火山 RTC</text>
<rect x="296" y="410" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="310" y="430" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">本地模型</text>
<text x="310" y="450" font-size="11" fill="#185FA5" dominant-baseline="central">YuNet + SFace</text>
<text x="310" y="466" font-size="11" fill="#185FA5" dominant-baseline="central">Hash 嵌入（离线）</text>
<rect x="474" y="410" width="166" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="488" y="430" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">本地存储</text>
<text x="488" y="450" font-size="11" fill="#185FA5" dominant-baseline="central">SQLite · Milvus</text>
<text x="488" y="466" font-size="11" fill="#185FA5" dominant-baseline="central">IndexedDB · JSON</text>
</svg>
