<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
<title>工具审批 LangGraph 子图</title>
<desc>open_file 在启用审批中断时进入该子图：创建审批单后由 interrupt 暂停，人工批准或拒绝后经 Command 恢复，分别执行批准或拒绝节点并结束。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="520" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="40" y="28" font-size="13" font-weight="500" fill="#1F2937">工具审批 · LangGraph 子图</text>
<text x="40" y="46" font-size="11" fill="#64748B">仅 open_file + LANGGRAPH_APPROVAL_INTERRUPT_ENABLED=true 时启用；否则走 ControlledToolService</text>

<rect x="300" y="60" width="80" height="36" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
<text x="340" y="78" font-size="11" fill="#334155" text-anchor="middle" dominant-baseline="central">START</text>

<rect x="240" y="120" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="138" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">创建工具审批</text>
<text x="340" y="158" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">execute → pending</text>

<rect x="240" y="210" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="228" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">等待工具审批</text>
<text x="340" y="248" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">interrupt() 暂停</text>

<rect x="470" y="96" width="170" height="86" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="484" y="116" font-size="11" font-weight="500" fill="#334155" dominant-baseline="central">恢复方式</text>
<text x="484" y="136" font-size="11" fill="#475569" dominant-baseline="central">Command(resume=...)</text>
<text x="484" y="154" font-size="11" fill="#475569" dominant-baseline="central">action=approve/reject</text>
<text x="484" y="172" font-size="11" fill="#475569" dominant-baseline="central">恢复后进入批准/拒绝</text>

<rect x="100" y="330" width="170" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="348" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">批准工具</text>
<text x="185" y="368" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">approve → success</text>

<rect x="410" y="330" width="170" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
<text x="495" y="348" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" dominant-baseline="central">拒绝工具</text>
<text x="495" y="368" font-size="11" fill="#475569" text-anchor="middle" dominant-baseline="central">reject → rejected</text>

<rect x="300" y="430" width="80" height="36" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
<text x="340" y="448" font-size="11" fill="#334155" text-anchor="middle" dominant-baseline="central">END</text>

<text x="40" y="494" font-size="11" fill="#64748B">Checkpointer：InMemorySaver 默认 / AsyncSqliteSaver 开启后；thread_id = tool-approval:{call_id}</text>

<path d="M340 96 V120" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 V210" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M240 238 H185 V330" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 238 H495 V330" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M185 386 V410 H340 V430" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 386 V410 H340 V430" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="210" y="300" font-size="11" fill="#64748B">approve</text>
<text x="455" y="300" font-size="11" fill="#64748B">reject</text>
</svg>
