<svg width="100%" viewBox="0 0 680 650" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
<title>核心功能模块关系图</title>
<desc>以对话编排为中心，语音与文本输入进入编排，人格、记忆、RAG 与身份提供上下文和权限，编排驱动受控工具、语音合成与桌宠事件，底部支撑带提供资源、状态与桌面进程能力。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="650" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="40" y="28" font-size="13" font-weight="500" fill="#1F2937">核心功能模块关系图</text>
<text x="40" y="46" font-size="11" fill="#64748B">以对话编排为中心；实线为运行期调用，虚线为权限门、口型与运行支撑</text>

<rect x="110" y="80" width="150" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="124" y="102" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">语音输入</text>
<text x="124" y="122" font-size="11" fill="#185FA5" dominant-baseline="central">ASR / VAD / 唤醒词</text>

<rect x="420" y="80" width="150" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="434" y="102" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">语音合成</text>
<text x="434" y="122" font-size="11" fill="#185FA5" dominant-baseline="central">TTS / 口型能量</text>

<rect x="40" y="190" width="130" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="54" y="212" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">人格系统</text>
<text x="54" y="232" font-size="11" fill="#185FA5" dominant-baseline="central">prompt / 音色</text>

<rect x="40" y="290" width="130" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="54" y="312" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">长期记忆</text>
<text x="54" y="332" font-size="11" fill="#185FA5" dominant-baseline="central">候选 → 确认</text>

<rect x="250" y="270" width="180" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="266" y="292" font-size="12" font-weight="500" fill="#085041" dominant-baseline="central">对话编排</text>
<text x="266" y="312" font-size="11" fill="#0F6E56" dominant-baseline="central">AgentService</text>
<text x="266" y="330" font-size="11" fill="#0F6E56" dominant-baseline="central">LangGraph / legacy</text>

<rect x="510" y="190" width="130" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="524" y="212" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">RAG 知识库</text>
<text x="524" y="232" font-size="11" fill="#185FA5" dominant-baseline="central">top-3 片段</text>

<rect x="510" y="290" width="130" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="524" y="312" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">身份与权限</text>
<text x="524" y="332" font-size="11" fill="#185FA5" dominant-baseline="central">owner / guest</text>

<rect x="510" y="430" width="130" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="524" y="452" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">受控工具</text>
<text x="524" y="472" font-size="11" fill="#185FA5" dominant-baseline="central">白名单 / 审批</text>

<rect x="300" y="430" width="150" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
