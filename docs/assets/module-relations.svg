<path d="M575 350 V430" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M430 350 V410 H540 V430" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 350 V390 H375 V430" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 144 V400 H450 V430" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M375 540 V490" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="392" y="520" font-size="11" fill="#64748B">支撑</text>
</svg>
