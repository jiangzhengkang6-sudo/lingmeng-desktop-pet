<rect x="80" y="555" width="150" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
<text x="94" y="577" font-size="12" font-weight="500" fill="#334155" dominant-baseline="central">资源包与双渲染</text>
<text x="94" y="597" font-size="11" fill="#475569" dominant-baseline="central">Sprite / Canvas / Godot</text>
<rect x="265" y="555" width="150" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
<text x="279" y="577" font-size="12" font-weight="500" fill="#334155" dominant-baseline="central">本地状态</text>
<text x="279" y="597" font-size="11" fill="#475569" dominant-baseline="central">提醒 / 设置 / 日志</text>
<rect x="450" y="555" width="150" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
<text x="464" y="577" font-size="12" font-weight="500" fill="#334155" dominant-baseline="central">Tauri 桌面壳</text>
<text x="464" y="597" font-size="11" fill="#475569" dominant-baseline="central">进程 / 落盘 / 安装</text>

